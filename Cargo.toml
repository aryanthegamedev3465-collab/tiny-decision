[workspace]
resolver = "2"
members = ["core", "cli"]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
authors      = ["Tiny Decision Team"]
license      = "MIT"
rust-version = "1.78"

[workspace.dependencies]
# ── Tauri ────────────────────────────────────────────────────────────────────
tauri            = { version = "2", features = ["protocol-asset"] }
tauri-build      = { version = "2", features = [] }
tauri-plugin-shell = { version = "2" }

# ── Async / HTTP ─────────────────────────────────────────────────────────────
tokio   = { version = "1", features = ["full"] }
axum    = { version = "0.7", features = ["macros", "multipart"] }
tower   = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "limit", "trace"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
hyper   = { version = "1", features = ["full"] }

# ── Database ─────────────────────────────────────────────────────────────────
rusqlite = { version = "0.31", features = ["bundled", "chrono", "uuid"] }

# ── Serialization ────────────────────────────────────────────────────────────
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
serde_yaml   = "0.9"

# ── Error handling ───────────────────────────────────────────────────────────
anyhow    = "1"
thiserror = "1"

# ── Time / IDs ───────────────────────────────────────────────────────────────
chrono = { version = "0.4", features = ["serde"] }
uuid   = { version = "1", features = ["v4", "serde"] }

# ── Crypto / Hashing ─────────────────────────────────────────────────────────
sha2    = "0.10"
hex     = "0.4"
aes-gcm = "0.10"

# ── ML / Inference ───────────────────────────────────────────────────────────
llama-cpp-2 = { version = "0.1", optional = true }
ort         = { version = "2", features = ["download-binaries"], optional = true }
wasmtime    = { version = "21", features = ["async"] }

# ── Tracing ──────────────────────────────────────────────────────────────────
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# ── TypeScript bindings ───────────────────────────────────────────────────────
ts-rs = { version = "9", features = ["chrono-impl", "uuid-impl", "serde-compat"] }

# ── Utilities ────────────────────────────────────────────────────────────────
dashmap    = "6"
parking_lot = "0.12"
once_cell  = "1"
bytes      = "1"
futures    = "0.3"
async-trait = "0.1"
zip        = "2"
tempfile   = "3"
dirs       = "5"
base64     = "0.22"
regex      = "1"
itertools  = "0.13"
rand       = "0.8"
nalgebra   = "0.33"
utoipa     = { version = "4", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "7", features = ["axum"] }
governor   = "0.6"
nonzero_ext = "0.3"
