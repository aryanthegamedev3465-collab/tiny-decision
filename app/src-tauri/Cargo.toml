[package]
name = "tiny-decision-app"
version = "0.1.0"
edition = "2021"
authors = ["Tiny Decision Authors"]
description = "Tiny Decision – System One AI Decision Engine (Tauri Desktop App)"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "tiny_decision_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "tiny-decision"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# Tauri
tauri = { version = "2.0", features = [
    "tray-icon",
    "image-png",
    "protocol-asset",
] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-http = "2.0"
tauri-plugin-notification = "2.0"
tauri-plugin-process = "2.0"
tauri-plugin-updater = "2.0"
tauri-plugin-window-state = "2.0"

# Async runtime
tokio = { version = "1.37", features = ["full"] }

# HTTP server
axum = { version = "0.7", features = ["multipart"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }

# Database
rusqlite = { version = "0.31", features = ["bundled"] }
rusqlite_migration = "1.2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# IDs
uuid = { version = "1.8", features = ["v7", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# File paths
dirs = "5.0"

# WASM plugin host
wasmtime = "20.0"
wasmtime-wasi = "20.0"

# Concurrency
once_cell = "1.19"
parking_lot = "0.12"

# Channel / state management
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"

# llama.cpp bindings
llama-cpp-rs = { version = "0.3", optional = true }

[features]
default = ["local-inference"]
local-inference = ["llama-cpp-rs"]
cloud-only = []

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = "symbols"
